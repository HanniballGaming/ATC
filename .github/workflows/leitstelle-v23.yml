name: Leitstelle Deutschland v0.23 veröffentlichen
on:
  push:
    branches: [leitstelle-deutschland-release]
    paths:
      - 'ai_dispatch_v23.js'
      - 'release_v23.py'
      - '.github/workflows/leitstelle-v23.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webapp-aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leitstelle-deutschland-release
          persist-credentials: true
      - name: Version 0.23 erstellen
        run: python3 release_v23.py
      - name: Archiv veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEITSTELLE_DEUTSCHLAND_v0_21.zip
          if git diff --cached --quiet; then
            echo "Kein geändertes Archiv"
          else
            git commit -m "Publish Leitstelle Deutschland v0.23 caller and colleague AI"
            git push origin HEAD:leitstelle-deutschland-release
          fi
