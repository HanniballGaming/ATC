name: FUNKSPRUCH – Windows-Installationspaket
on:
  push:
    branches: [funkspruch-v1-integration]
  workflow_dispatch:
concurrency:
  group: funkspruch-v025-acceptance-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vorhandenes Einsatzleitsystem inklusive Embed-Brücke verpacken
        run: python release_v23.py
      - name: Echte Augsburger OSM-Daten für Offline-Spiel bereitstellen
        run: python scripts/export_osm_augsburg.py
      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Gemeinsame Web-Codebasis bauen
        working-directory: desktop
        run: npm run prepare:web
      - name: Integrations- und Logiktests
        working-directory: desktop
        run: npm run verify
      - name: Echten Electron-Start und Speicherpersistenz prüfen
        timeout-minutes: 4
        working-directory: desktop
        run: node electron-smoke.mjs
      - name: Windows-Setup erstellen
        working-directory: desktop
        run: npm run build:windows
      - name: Gepackte Windows-App tatsächlich starten
        shell: pwsh
        run: |
          $appFile = Join-Path $PWD "desktop/release/win-unpacked/FUNKSPRUCH.exe"
          if (!(Test-Path $appFile)) { throw "Gepackte FUNKSPRUCH.exe fehlt" }
          $process = Start-Process -FilePath $appFile -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 24; $i++) {
              Start-Sleep -Milliseconds 750
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:47821/openworld/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "FUNKSPRUCH") { $ok = $true; break }
              } catch {}
            }
            if (!$ok) { throw "Installierte Programmbinärdatei startet keinen gültigen lokalen Spielserver" }
            Write-Host "Gepackte Windows-App startet die FUNKSPRUCH-3D-Welt erfolgreich."
          } finally {
            Get-Process -Name "FUNKSPRUCH" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Browserfassung als ZIP-Testartefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FUNKSPRUCH-Browser-Testversion
          path: desktop/web/
          if-no-files-found: error
          retention-days: 14
      - name: Windows-Setup als Test-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FUNKSPRUCH-Windows-Testversion
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hauptsimulator mit Schicht- und Monitorbrücke verpacken
        run: python release_v23.py
      - name: Testumgebung installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Webfassung vorbereiten
        working-directory: desktop
        run: npm run prepare:web
      - name: Vorinstallierten Google Chrome prüfen
        run: google-chrome --version
      - name: Schicht und vollständigen Leitstellenmonitor im Browser prüfen
        working-directory: desktop
        run: node browser-smoke.mjs
      - name: Mobile First-Person-Touchsteuerung im Browser prüfen
        working-directory: desktop
        run: node tablet-smoke.mjs
