name: FUNKSPRUCH – Windows-Installationspaket
on:
  push:
    branches: [funkspruch-v1-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vorhandenes Einsatzleitsystem inklusive Embed-Brücke verpacken
        run: python release_v23.py
      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Gemeinsame Web-Codebasis bauen
        working-directory: desktop
        run: npm run prepare:web
      - name: Integrations- und Logiktests
        working-directory: desktop
        run: npm run verify
      - name: Echten Electron-Start und Speicherpersistenz prüfen
        working-directory: desktop
        run: node electron-smoke.mjs
      - name: Windows-Setup erstellen
        working-directory: desktop
        run: npm run build:windows
      - name: Windows-Setup als Test-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FUNKSPRUCH-Windows-Testversion
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hauptsimulator mit Schicht- und Monitorbrücke verpacken
        run: python release_v23.py
      - name: Testumgebung installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Webfassung vorbereiten
        working-directory: desktop
        run: npm run prepare:web
      - name: Diagnose der alten Karteninitialisierung
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import re
          with ZipFile('LEITSTELLE_DEUTSCHLAND_v0_21.zip') as z:
              js=z.read('world.js').decode('utf-8')
          print('world.js size',len(js))
          for token in ('circleMarker','updateRealMap','lat','lon'):
              matches=list(re.finditer(token,js))
              print('TOKEN',token,'HITS',len(matches))
              for m in matches[:10]:
                  print('CONTEXT',repr(js[max(0,m.start()-240):min(len(js),m.end()+280)]))
          PY
      - name: Chromium für Browsertest installieren
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Schicht und vollständigen Leitstellenmonitor im Browser prüfen
        working-directory: desktop
        run: node browser-smoke.mjs
