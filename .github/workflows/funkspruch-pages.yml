name: FUNKSPRUCH – iPad-Browser-Veröffentlichung
on:
  push:
    branches: [funkspruch-v1-integration]
    paths:
      - 'public/**'
      - 'desktop/**'
      - 'scripts/export_osm_augsburg.py'
      - 'release_v23.py'
      - 'funkspruch_embed.js'
      - 'LEITSTELLE_DEUTSCHLAND_v0_21.zip'
      - '.github/workflows/funkspruch-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: funkspruch-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vollständiges Leitstellensystem integrieren
        run: python release_v23.py
      - name: Reale Augsburger OSM-Karten bereitstellen
        run: python scripts/export_osm_augsburg.py
      - name: Browser- und iPad-Version erstellen
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run prepare:web
          npm run verify
      - name: iPad-Touchsteuerung und Pausenmenü prüfen
        working-directory: desktop
        run: node tablet-smoke.mjs
      - name: Gesamte Notruf- und Funksimulation prüfen
        working-directory: desktop
        run: node browser-smoke.mjs
      - name: Statische Veröffentlichung vorbereiten
        run: |
          touch desktop/web/.nojekyll
          test -f desktop/web/openworld/index.html
          test -f desktop/web/index.html
          test -f desktop/web/openworld/city-region.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: desktop/web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: FUNKSPRUCH öffentlich veröffentlichen
        id: publish
        uses: actions/deploy-pages@v4
      - name: Link der veröffentlichten Spielversion
        run: echo "FUNKSPRUCH: ${{ steps.publish.outputs.page_url }}openworld/"
