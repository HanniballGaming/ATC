<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NORDTAL 3D Tower</title><style>body{margin:0;background:#08141d;color:#fff;font:15px system-ui}header{padding:12px;background:#102936;display:flex;gap:10px;flex-wrap:wrap}input,button{font-size:16px;min-height:44px;border-radius:7px}input{width:115px}button{background:#23677b;color:white;border:0;padding:0 12px}canvas{display:block;width:100vw;height:calc(100dvh - 105px);touch-action:none}#info{padding:7px}</style><header><b>NORDTAL | 3D TOWER</b><input id="room" value="PUBLIC" aria-label="Room"><button id="join">Connect</button><a href="index.html" style="color:#8de6ff">Radar</a></header><div id="info">Perspective airport preview · 3D canvas rendering · shared multiplayer positions</div><canvas id="view"></canvas><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let planes=[],socket=null,angle=0;
function connect(){if(socket)socket.close();socket=new WebSocket((localStorage.getItem('atc_server_url')||((location.protocol==='https:'?'wss://':'ws://')+location.host)));socket.onopen=()=>{let token=sessionStorage.getItem('atc_token');if(token)socket.send(JSON.stringify({type:'resume',token}));else document.getElementById('info').textContent='Log in on the Radar page first';};socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='authenticated')socket.send(JSON.stringify({type:'join',room:document.getElementById('room').value}));if(m.type==='state')planes=m.aircraft||[];if(m.type==='error')document.getElementById('info').textContent=m.message;};}
document.getElementById('join').onclick=connect;
function draw(){let dpr=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#356b94');sky.addColorStop(.56,'#a6c5d1');sky.addColorStop(.57,'#476b48');sky.addColorStop(1,'#263c30');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
const horizon=h*.56,center=w/2;function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();}
poly([[center-30,horizon],[center+30,horizon],[center+w*.42,h],[center-w*.42,h]],'#343d42');
for(let i=1;i<=9;i++){let t=i/10,y=horizon+(h-horizon)*t*t,ww=25+t*w*.36;poly([[center-ww*.04,y],[center+ww*.04,y],[center+ww*.08,y+3+i],[center-ww*.08,y+3+i]],'#e5e4ce');}
poly([[center-w*.25,horizon+12],[center-w*.19,horizon+12],[center-w*.52,h],[center-w*.6,h]],'#667476');
poly([[center+w*.19,horizon+12],[center+w*.25,horizon+12],[center+w*.6,h],[center+w*.52,h]],'#667476');
ctx.fillStyle='#152f3c';ctx.fillRect(0,h*.86,w,h*.14);ctx.fillStyle='#b8d2dc';ctx.font='13px system-ui';ctx.fillText('TOWER WINDOW · RWY 09/27 · VISUAL PREVIEW',12,h*.91);
planes.slice(0,24).forEach((a,i)=>{let x=center+Math.sin(i*2.4+angle)*w*.39,y=horizon-30-Math.abs(Math.cos(i*1.7+angle))*h*.27;ctx.fillStyle='#f6f8f9';ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x-13,y+6);ctx.lineTo(x+13,y+6);ctx.closePath();ctx.fill();ctx.fillStyle='#102532';ctx.fillRect(x-18,y-28,Math.max(45,String(a.callsign||'').length*8),17);ctx.fillStyle='white';ctx.font='11px system-ui';ctx.fillText(a.callsign||'TRAFFIC',x-15,y-16);});
requestAnimationFrame(draw);}draw();
canvas.addEventListener('pointermove',e=>{if(e.buttons)angle+=(e.movementX||0)*.005});connect();
</script></html>
