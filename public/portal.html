<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LEITSTELLE DEUTSCHLAND – Spielportal</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1520;color:#e9f3fc;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#102436;border-bottom:1px solid #385168;min-height:58px}strong{font-size:15px}button{cursor:pointer;border:1px solid #587994;background:#234b68;color:white;padding:10px 12px;border-radius:8px}button[aria-pressed=true]{background:#087e82;border-color:#58d6d4}button:disabled{opacity:.5;cursor:not-allowed}#state{font-size:12px;color:#bdd2e0;margin-left:auto}#message{font-size:12px;color:#ffdc97}main{height:calc(100dvh - 58px);position:relative}iframe{width:100%;height:100%;border:0;display:none;background:#101820}iframe.active{display:block}@media(max-width:800px){header{gap:5px}button{padding:8px}main{height:calc(100dvh - 106px)}}
</style></head><body><header><strong>LEITSTELLE DEUTSCHLAND</strong><button id="dispatch" aria-pressed="true">Leitstelle</button><button id="world" aria-pressed="false">Open World</button><button id="start">Dienst beginnen</button><button id="end">Dienst beenden</button><span id="state"></span><span id="message" role="status"></span></header><main><iframe id="dispatchFrame" title="Leitstellensimulator" src="/"></iframe><iframe id="worldFrame" title="Begehbare Stadt" src="/openworld/"></iframe></main><script src="/openworld/life-core.js"></script><script>
(()=>{"use strict";
const $=id=>document.getElementById(id),life=LDOpenWorldLife.create(),state=$("state"),message=$("message");try{life.load()}catch(e){message.textContent="Spielstand konnte nicht geladen werden"}
function display(){const s=life.snapshot();state.textContent=(s.onDuty?"Im Dienst":"Dienstfrei")+" · "+s.location+" · "+Math.floor(s.minutes/60%24).toString().padStart(2,"0")+":"+Math.floor(s.minutes%60).toString().padStart(2,"0");$("start").disabled=s.onDuty;$("end").disabled=!s.onDuty}
function show(target){const dispatch=target==="dispatch";$("dispatchFrame").classList.toggle("active",dispatch);$("worldFrame").classList.toggle("active",!dispatch);$("dispatch").setAttribute("aria-pressed",String(dispatch));$("world").setAttribute("aria-pressed",String(!dispatch));history.replaceState(null,"",dispatch?"#leitstelle":"#stadt")}
function shift(start){try{life.moveTo("leitstelle");life.action(start?"dienstbeginn":"dienstende");life.save();display();message.textContent=start?"Dienst begonnen":"Dienst beendet";show(start?"dispatch":"world");$("worldFrame").contentWindow?.postMessage({type:"ld-life-reload"},location.origin)}catch(e){message.textContent=e.message}}
$("dispatch").onclick=()=>show("dispatch");$("world").onclick=()=>show("world");$("start").onclick=()=>shift(true);$("end").onclick=()=>shift(false);
window.addEventListener("storage",e=>{if(e.key==="ld-openworld-life-v1"){try{life.load();display()}catch{}}});
window.addEventListener("message",e=>{if(e.origin!==location.origin||e.data?.type!=="ld-life-updated")return;try{life.load();display()}catch{}});
show(location.hash==="#stadt"?"world":"dispatch");display();
})();
</script></body></html>
