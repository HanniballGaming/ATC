<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEITSTELLE DEUTSCHLAND – Open-World-Integrationstest</title>
<style>html,body{margin:0;width:100%;height:100%;font-family:system-ui;background:#101820;color:white}
#world{position:absolute;inset:0}#panel{position:absolute;top:12px;left:12px;z-index:40;background:#10202de8;border-radius:12px;padding:12px;max-width:340px;font-size:13px}
button{padding:8px;margin:3px;background:#204f71;color:white;border:1px solid #7a9db3;border-radius:6px}
#info{white-space:pre-wrap;max-height:180px;overflow:auto}</style></head><body>
<div id="world"></div><div id="panel"><strong>LEITSTELLE DEUTSCHLAND · Open World</strong>
<p>WASD bewegen · Shift laufen · E ein-/aussteigen · Touch-Joysticks auf Mobilgeräten</p>
<button id="interact">Ein-/Aussteigen (E)</button><button id="eat">Essen</button>
<button id="sleep">Schlafen</button><div id="info">Initialisierung …</div>
<small>Geodaten: © OpenStreetMap contributors (ODbL). Für den Integrationstest werden synthetische Geometrien verwendet.</small></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="./geo-core.js"></script><script src="./collision-core.js"></script>
<script src="./three-city.js"></script><script src="./vehicle-core.js"></script>
<script src="./vehicle-interaction.js"></script><script src="./walker-core.js"></script>
<script src="./life-core.js"></script><script src="./road-graph.js"></script>
<script src="./osm-loader.js"></script><script src="./touch-controls.js"></script>
<script src="./runtime.js"></script><script src="./integration-tests.js"></script>
<script>
(async()=>{
const info=document.getElementById("info");
const tests=await LDOpenWorldIntegrationTests.run();
info.textContent="Modultests: "+tests.passed+"/"+tests.total+" bestanden\n"+tests.results.filter(r=>!r.ok).map(r=>r.name+": "+r.error).join("\n");
const origin={lon:10.8985,lat:48.3705};
const geojson={type:"FeatureCollection",features:[
 {type:"Feature",properties:{highway:"residential"},geometry:{type:"LineString",coordinates:[[10.8983,48.3705],[10.901,48.3705]]}},
 {type:"Feature",properties:{building:"yes","building:levels":"3"},geometry:{type:"Polygon",coordinates:[[[10.899,48.3708],[10.8993,48.3708],[10.8993,48.3706],[10.899,48.3706],[10.899,48.3708]]]}},
 {type:"Feature",properties:{building:"yes","building:levels":"2"},geometry:{type:"Polygon",coordinates:[[[10.900,48.3708],[10.9002,48.3708],[10.9002,48.3706],[10.900,48.3706],[10.900,48.3708]]]}}
]};
try{
if(tests.passed!==tests.total)throw Error("Modultests fehlgeschlagen: "+JSON.stringify(tests.results.filter(t=>!t.ok)));
if(typeof THREE==="undefined")throw Error("Three.js konnte nicht geladen werden");
const game=LDOpenWorldRuntime.create({THREE,host:document.getElementById("world"),geojson,origin,onStatus:s=>{info.textContent="Modultests: "+tests.passed+"/"+tests.total+"\n"+JSON.stringify(s,null,2)}});
await game.start();
try{game.life.load()}catch(e){console.warn("Life save could not be loaded",e)}
const persistLife=()=>{game.life.save();if(window.parent!==window)window.parent.postMessage({type:"ld-life-updated"},location.origin)};
window.addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.type==="ld-life-reload"){try{game.life.load()}catch(err){console.warn(err)}}});
window.addEventListener("pagehide",persistLife);
document.getElementById("interact").onclick=()=>game.interact();
document.getElementById("eat").onclick=()=>{try{game.life.action("essen");persistLife()}catch(e){alert(e.message)}info.textContent=JSON.stringify(game.status(),null,2)};
document.getElementById("sleep").onclick=()=>{try{game.life.action("schlafen");persistLife()}catch(e){alert(e.message)}info.textContent=JSON.stringify(game.status(),null,2)};
window.addEventListener("keydown",e=>{if(e.code==="KeyE"&&!e.repeat)game.interact()});
setInterval(()=>{if(!info.textContent.startsWith("Fehler:"))info.textContent="Modultests: "+tests.passed+"/"+tests.total+"\n"+JSON.stringify(game.status(),null,2)},500);
}catch(e){info.textContent="Fehler: "+e.stack;console.error(e)}
})();
</script></body></html>
