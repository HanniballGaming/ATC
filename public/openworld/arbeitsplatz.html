<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FUNKSPRUCH – Einsatzleitsystem</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111e;color:#deedf5;font-family:system-ui,Segoe UI,sans-serif}
main{display:flex;flex-direction:column;height:100dvh}header{display:flex;align-items:center;gap:10px;min-height:42px;background:#10283b;border-bottom:1px solid #42647b;padding:5px 11px;font-size:12px}
header strong{color:#91dbea;letter-spacing:.05em}#status{margin-left:auto;color:#b8c8d4}button{background:#1a4059;color:white;border:1px solid #507a92;padding:6px 10px;border-radius:5px;cursor:pointer}
iframe{width:100%;flex:1;min-height:0;border:0;background:#081625}small{color:#9dbacc}
#help{position:absolute;bottom:10px;left:12px;background:#071625d9;padding:6px 9px;border-radius:6px;pointer-events:none;font-size:11px}
@media(max-width:550px){header{gap:5px;padding:5px;font-size:11px}header strong{display:none}#help{font-size:10px}}
</style>
</head>
<body><main>
<header><strong>FUNKSPRUCH</strong><span>Leitplatz · Einsatzleitsystem</span><span id="status" role="status">Verbindung wird hergestellt …</span>
<button id="reload" title="Einsatzleitsystem neu laden">Neu laden</button><button id="backup" title="Einfache Ersatzansicht">Ersatzansicht</button></header>
<iframe id="els" title="Vollständiges Einsatzleitsystem" allow="autoplay" src="../index.html?fs_embed=1"></iframe>
</main>
<div id="help">Erstmalig Leitstelle im ELS auswählen · Keine echten Notrufverbindungen</div>
<script>
(()=>{"use strict";
const frame=document.getElementById("els"),status=document.getElementById("status");
let backup=false,ready=false;
function shift(){
 try{const data=JSON.parse(localStorage.getItem("ld-openworld-life-v1")||"{}");return {onDuty:data.onDuty===true,minutes:Number.isFinite(data.minutes)?data.minutes:null};}
 catch{return {onDuty:false,minutes:null};}
}
function send(){
 if(backup||!frame.contentWindow)return;
 const s=shift();
 frame.contentWindow.postMessage({type:"funkspruch:desk-context",onDuty:s.onDuty,minutes:s.minutes},location.origin);
}
frame.addEventListener("load",()=>{status.textContent=backup?"Ersatzansicht geladen":"ELS geladen · Synchronisierung läuft";send();});
window.addEventListener("message",event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin||!event.data||backup)return;
 if(event.data.type==="funkspruch:embedded-ready"){ready=true;send();}
 if(event.data.type==="funkspruch:dispatch-summary"&&window.parent!==window)window.parent.postMessage(event.data,location.origin);
 if(event.data.type==="funkspruch:embedded-status"){
   status.textContent=event.data.message||"Einsatzleitsystem bereit";
   status.style.color=event.data.status==="fehler"?"#ffb1b1":"#b8c8d4";
 }
});
document.getElementById("reload").addEventListener("click",()=>{ready=false;frame.src=backup?"./arbeitsplatz-basis.html":"../index.html?fs_embed=1";});
document.getElementById("backup").addEventListener("click",()=>{backup=!backup;ready=false;frame.src=backup?"./arbeitsplatz-basis.html":"../index.html?fs_embed=1";document.getElementById("backup").textContent=backup?"Vollständiges ELS":"Ersatzansicht";status.textContent="Lade …";});
setInterval(send,1800);
setTimeout(()=>{if(!ready&&!backup)status.textContent="ELS startet – bei Problemen Ersatzansicht wählen";},10000);
})();
</script></body></html>
